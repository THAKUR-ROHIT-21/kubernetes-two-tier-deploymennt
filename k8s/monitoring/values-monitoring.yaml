prometheus:
  prometheusSpec:
    retention: 15d

    nodeSelector:
      kubernetes.io/hostname: monitoring-node

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi


grafana:
  nodeSelector:
    kubernetes.io/hostname: monitoring-node

  persistence:
    enabled: true
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 5Gi

  adminPassword: "Strong@123!"

  service:
    type: NodePort
    nodePort: 30090


alertmanager:
  alertmanagerSpec:
    nodeSelector:
      kubernetes.io/hostname: monitoring-node

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

  service:
    type: NodePort
    nodePort: 30093

  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: "discord-notification"

      group_by:
        - alertname
        - namespace

      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

      routes:
        - receiver: "null"
          matchers:
            - 'alertname = "Watchdog"'

    receivers:
      - name: "null"

      - name: "discord-notification"
        discord_configs:
          - webhook_url: "https://discord.com/api/webhooks/1534261126756306954/DfMJcYuUb-_zU0ShkmfC2Q1troY_HShPJQKlR09_LKP83DDAm4Jes57wlB8e3MZX3Txa"
            send_resolved: true


additionalPrometheusRulesMap:
  custom-kubernetes-rules:
    groups:
      - name: custom-kubernetes-apps

        rules:
          - alert: KubePodCrashLoopingFast

            expr: |
              kube_pod_container_status_waiting_reason{
                reason="CrashLoopBackOff"
              } == 1

            for: 2m

            labels:
              severity: warning

            annotations:
              summary: "Pod is in CrashLoopBackOff"
              description: >-
                Pod {{ $labels.namespace }}/{{ $labels.pod }}
                container {{ $labels.container }}
                is in CrashLoopBackOff.


          - alert: KubePodOOMKilled

            expr: |
              (
                kube_pod_container_status_last_terminated_reason{
                  reason="OOMKilled"
                } == 1
              )
              and on (namespace, pod, container)
              (
                increase(
                  kube_pod_container_status_restarts_total[10m]
                ) > 0
              )

            for: 10s

            labels:
              severity: critical

            annotations:
              summary: "Container was OOMKilled"
              description: >-
                Pod {{ $labels.namespace }}/{{ $labels.pod }}
                container {{ $labels.container }}
                was OOMKilled and restarted during the last 10 minutes.


          - alert: KubePodNotReady

            expr: |
              sum by (namespace, pod) (
                max by (namespace, pod) (
                  kube_pod_status_phase{
                    phase=~"Pending|Unknown"
                  }
                )
              ) > 0

            for: 5m

            labels:
              severity: warning

            annotations:
              summary: "Pod is not ready"
              description: >-
                Pod {{ $labels.namespace }}/{{ $labels.pod }}
                has remained Pending or Unknown for more than 5 minutes.


          - alert: KubeDeploymentReplicasMismatch

            expr: |
              kube_deployment_spec_replicas
              !=
              kube_deployment_status_replicas_available

            for: 5m

            labels:
              severity: warning

            annotations:
              summary: "Deployment replicas mismatch"
              description: >-
                Deployment {{ $labels.namespace }}/{{ $labels.deployment }}
                does not have the expected number of available replicas.


          - alert: KubeNodeNotReady

            expr: |
              kube_node_status_condition{
                condition="Ready",
                status="true"
              } == 0

            for: 5m

            labels:
              severity: critical

            annotations:
              summary: "Kubernetes node is NotReady"
              description: >-
                Node {{ $labels.node }}
                has remained NotReady for more than 5 minutes.


          - alert: KubernetesPodHighMemoryUsage

            expr: |
              (
                sum by (namespace, pod) (
                  container_memory_working_set_bytes{
                    container!="",
                    image!=""
                  }
                )
                /
                sum by (namespace, pod) (
                  kube_pod_container_resource_limits{
                    resource="memory",
                    unit="byte"
                  }
                )
              ) * 100 > 90

            for: 5m

            labels:
              severity: warning

            annotations:
              summary: "Pod memory usage is high"
              description: >-
                Pod {{ $labels.namespace }}/{{ $labels.pod }}
                is using more than 90 percent of its configured memory limit.


          - alert: KubernetesPodHighCPUUsage

            expr: |
              (
                sum by (namespace, pod) (
                  rate(
                    container_cpu_usage_seconds_total{
                      container!="",
                      image!=""
                    }[5m]
                  )
                )
                /
                sum by (namespace, pod) (
                  kube_pod_container_resource_limits{
                    resource="cpu",
                    unit="core"
                  }
                )
              ) * 100 > 90

            for: 5m

            labels:
              severity: warning

            annotations:
              summary: "Pod CPU usage is high"
              description: >-
                Pod {{ $labels.namespace }}/{{ $labels.pod }}
                is using more than 90 percent of its configured CPU limit.